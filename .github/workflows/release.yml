name: Create release

# Add releases/vX.Y.Z.md on main and this creates release vX.Y.Z with those
# notes (existing releases get their notes refreshed). Then drag the zip onto the release page.
on:
  push:
    branches: [main]
    paths: ["releases/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a release for each new notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in releases/v*.md; do
            tag=$(basename "$notes" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes"   # keep notes in step with the file
              echo "$tag notes updated"
            else
              gh release create "$tag" --target main --notes-file "$notes" \
                --title "ASTFC Voice Protocol ${tag#v} (test build)"
            fi
          done
