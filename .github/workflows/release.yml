name: Create release

# Manual fallback only. Normal releases are published from the private source repo
# (ideal-engine > Actions > "Publish ASTFC Command Bridge"), which also uploads the files.
# Running this creates a release for any releases/vX.Y.Z.md that has none yet.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a release for each new notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in releases/v*.md; do
            tag=$(basename "$notes" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists"
            else
              gh release create "$tag" --target main --notes-file "$notes" \
                --title "ASTFC Command Bridge ${tag#v} (test build)"
            fi
          done
